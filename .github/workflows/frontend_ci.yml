name: frontend_ci

on:
  pull_request:
    branches: [ pipeline_workflow ]
    paths:
      - 'frontend/**'
  push: 
    branches: [ pipeline_workflow ]
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Run Frontend Build Verification
        run: | 
          cd frontend
          npm ci 
          npm run build