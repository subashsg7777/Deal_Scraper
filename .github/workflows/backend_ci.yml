name: Backend CI

on:
  pull_request:
    branches: [ pipeline_workflow ]
    paths:
      - 'backend/**'
  push:
    branches: [ pipeline_workflow ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # ⬇️ ADD THIS LINE (Replace 'Copilot' or 'development' with your exact GitHub Environment name)
    environment: Production 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Print and Verify MongoDB Env Structure Safely
        env:
          SPRING_DATA_MONGODB_URI: ${{ secrets.SPRING_DATA_MONGODB_URI }}
          DB_MONGO_DB_URI: ${{ secrets.DB_MONGO_DB_URI }}
        run: |
          echo "======================================================="
          echo "          SAFE MONGO ENVIRONMENT VARIABLE DEBUG        "
          echo "======================================================="
          
          if [ -z "$SPRING_DATA_MONGODB_URI" ]; then
            echo "❌ SPRING_DATA_MONGODB_URI: [EMPTY/NOT FOUND]"
          else
            MASKED_PREVIEW=$(echo "$SPRING_DATA_MONGODB_URI" | sed 's/\/\/.*@/\/\/<REDACTED_CREDENTIALS>@/g' | cut -c1-50)
            echo "✅ SPRING_DATA_MONGODB_URI is loaded!"
            echo "   • Length: ${#SPRING_DATA_MONGODB_URI} characters"
            echo "   • Format check: $MASKED_PREVIEW..."
          fi

          if [ -z "$DB_MONGO_DB_URI" ]; then
            echo "❌ DB_MONGO_DB_URI: [EMPTY/NOT FOUND]"
          else
            MASKED_PREVIEW=$(echo "$DB_MONGO_DB_URI" | sed 's/\/\/.*@/\/\/<REDACTED_CREDENTIALS>@/g' | cut -c1-50)
            echo "✅ DB_MONGO_DB_URI is loaded!"
            echo "   • Length: ${#DB_MONGO_DB_URI} characters"
            echo "   • Format check: $MASKED_PREVIEW..."
          fi
          echo "======================================================="

      - name: Run Backend Unit Tests
        env:
          SPRING_DATA_MONGODB_URI: ${{ secrets.SPRING_DATA_MONGODB_URI }}
          DB_MONGO_DB_URI: ${{ secrets.DB_MONGO_DB_URI }}
        run: |
          cd backend/Deal_Scrapper
          chmod +x mvnw
          ./mvnw clean test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Upload Multi-stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/Deal_Scrapper
          file: ./backend/Deal_Scrapper/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/deal-scrapper-backend:latest

      - name: Using Automated Deployment From Docker Image
        run: |
          echo "Calling Out Render Deploy Hook"
          curl -x POST "${{secrets.RENDER_DEPLOY_HOOK}}"