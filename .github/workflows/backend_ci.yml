name: Backend CI

on:
  pull_request:
    branches: [ pipeline_workflow ]
    paths:
      - 'backend/**'
  push:
    branches: [ pipeline_workflow ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit Tests
        env:
          SPRING_DATA_MONGODB_URI: ${{ secrets.SPRING_DATA_MONGODB_URI }}
          DB_MONGO_DB_URI: ${{ secrets.DB_MONGO_DB_URI }}
        run: |
          cd backend/Deal_Scrapper
          chmod +x mvnw
          ./mvnw clean test

        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

        name: Build and Upload Multi-stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/Deal_Scrapper
          file: ./backend/Deal_Scrapper/Dockerfile
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/deal-scrapper-backend:latest