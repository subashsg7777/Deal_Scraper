name: Backend CI

on:
  pull_request:
    branches: [ pipeline_workflow ]
    paths:
      - 'backend/**'
  push:
    branches: [ pipeline_workflow ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit Tests
        env:
          SPRING_DATA_MONGODB_URI: ${{ secrets.SPRING_DATA_MONGODB_URI }}
          DB_MONGO_DB_URI: ${{ secrets.DB_MONGO_DB_URI }}
        run: |
          cd backend/Deal_Scrapper
          chmod +x mvnw

          # Normalize secret formats like "KEY=mongodb+srv://..." and guarantee a valid URI in CI.
          RAW_URI="${SPRING_DATA_MONGODB_URI:-${DB_MONGO_DB_URI:-}}"
          if [[ "$RAW_URI" == *=* ]]; then
            RAW_URI="${RAW_URI#*=}"
          fi
          RAW_URI="$(echo "$RAW_URI" | tr -d '\r' | xargs)"

          if [[ ! "$RAW_URI" =~ ^mongodb(\+srv)?:\/\/ ]]; then
            RAW_URI="mongodb://localhost:27017/deal_scrapper"
          fi

          export SPRING_DATA_MONGODB_URI="$RAW_URI"
          echo "Using sanitized Mongo URI for tests"

          ./mvnw clean test