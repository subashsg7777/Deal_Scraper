spring.application.name=Deal_Scrapper


spring.config.import=optional:classpath:.env[.properties],optional:file:.env[.properties],optional:file:src/main/resources/.env[.properties]
# 
server.port=${PORT:8080}

# Canonical Spring Mongo keys with compatibility fallbacks for existing env names.
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI:${DB_MONGO_DB_URI:${MONGODB_URI:}}}
spring.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:${MONGODB_DATABASE:deal_scrapper}}


app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://deal-scraper.vercel.app,https://www.deal-scraper.tech}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app}